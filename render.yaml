services:
  - type: web
    name: bgt-studio
    runtime: python
    plan: starter
    buildCommand: python -m pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: bgt-studio-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: BGT_DATABASE_PATH
        value: /var/data/bgt.sqlite3
      - key: BGT_API_TOKEN
        generateValue: true
